name: Deploy Hugging Face inference Space

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/backend/ai/space/**"
      - ".github/workflows/deploy-huggingface-space.yml"

concurrency:
  group: takeoff-huggingface-space-production
  cancel-in-progress: false

jobs:
  deploy-space:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -q "huggingface_hub>=0.27,<2"
      - name: Upload the reviewed inference bundle
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          HfApi(token=os.environ["HF_TOKEN"]).upload_folder(
              repo_id="Siddartha96/takeoff-spaces-inference",
              repo_type="space",
              folder_path="app/backend/ai/space",
              commit_message="Deploy TakeOff room detection + production CLIP search",
          )
          PY
